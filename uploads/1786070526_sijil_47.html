<!DOCTYPE html>
<html lang="ms">
<head>
    <meta charset="UTF-8">
    <title>Akuan Pendaftaran Kontraktor / Pembekal</title>
    <style>
        /* Reset universal untuk buang sebarang margin tersembunyi */
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        @page {
            size: A4 portrait;
            margin: 0 !important;
        }

        html, body {
            width: 210mm;
            height: 297mm;
            margin: 0 auto;
            padding: 0;
            font-family: 'Arial', sans-serif;
            background-color: #f1f5f9;
        }

        /* Container A4 */
        .cert-container {
            width: 210mm;
            height: 297mm;
            margin: 0 auto;
            position: relative;
            background-color: #ffffff;
            overflow: hidden;
        }

        /* GAMBAR TEMPLAT (Memenuhi 100% ruang A4) */
        .cert-bg {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            object-fit: fill;
            z-index: 1;
        }

        /* TEKS DINAMIK */
        .text-field {
            position: absolute;
            font-size: 15px;
            color: #000000;
            font-weight: 600;
            z-index: 2;
            white-space: nowrap;
        }

        /* LARASKAN KEDUDUKAN (TOP & LEFT) MENGIKUT TEMPLAT JPG ANDA */
        .field-siri     { top: 360px; left: 600px; font-weight: bold; font-size: 12px; }
        .field-id       { top: 419px; left: 350px; font-weight: bold; }
        .field-mula     { top: 453px; left: 350px; font-weight: bold; }
        .field-tamat    { top: 488px; left: 350px; font-weight: bold; }
        .field-syarikat { top: 523px; left: 350px; font-weight: bold; text-transform: uppercase; }
        
        /* PEMBETULAN: Dibenarkan balut teks (wrap) untuk alamat panjang */
        .field-alamat   { top: 556px; left: 350px; width: 380px; line-height: 1.3; white-space: normal; font-weight: bold; }
        
        .field-pegawai  { top: 592px; left: 350px; text-transform: uppercase; font-weight: bold; }
        .field-gred     { top: 625px; left: 350px; font-weight: bold; }

        /* TETAPAN KHAS UNTUK CETAKAN (PRINT) */
        @media print {
            html, body, .cert-container {
                width: 210mm;
                height: 297mm;
                margin: 0 !important;
                padding: 0 !important;
                background: #ffffff !important;
            }
            .no-print {
                display: none !important;
            }
            * {
                -webkit-print-color-adjust: exact !important;
                print-color-adjust: exact !important;
            }
        }
    </style>
</head>
